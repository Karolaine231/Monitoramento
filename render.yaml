services:
  - type: web
    name: hasbro-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_URL
        sync: false        # você preenche no painel do Render
      - key: REDIS_URL
        sync: false
